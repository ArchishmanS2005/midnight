name: CredShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 · Compile Compact ZK Contract + Run Contract Tests
  # ──────────────────────────────────────────────────────────
  contract:
    name: Contract — Compile & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Compact compiler
        run: |
          npm install -g @midnight-ntwrk/compact-compiler 2>/dev/null || true
          compact --version 2>/dev/null && echo "✅ compact available" || echo "⚠️  compact not on PATH, will use npx"

      - name: Compile Compact ZK circuits
        working-directory: contract
        run: |
          npm run compact || npx --yes @midnight-ntwrk/compact-compiler compile src/credshield.compact ./src/managed/credshield

      - name: Type-check contract
        working-directory: contract
        run: npm run typecheck

      - name: Lint contract
        working-directory: contract
        run: npm run lint

      - name: Build contract
        working-directory: contract
        run: npm run build

      - name: Run contract tests (≥3 must pass)
        working-directory: contract
        run: npm run test -- --reporter=verbose

      - name: Upload contract build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: contract-dist
          path: contract/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # JOB 2 · Build API Layer
  # ──────────────────────────────────────────────────────────
  api:
    name: API — Typecheck & Build
    runs-on: ubuntu-latest
    needs: contract
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Download contract dist
        uses: actions/download-artifact@v4
        with:
          name: contract-dist
          path: contract/dist/

      - name: Typecheck & build API
        working-directory: api
        run: npm run ci

  # ──────────────────────────────────────────────────────────
  # JOB 3 · Build CLI
  # ──────────────────────────────────────────────────────────
  cli:
    name: CLI — Typecheck & Build
    runs-on: ubuntu-latest
    needs: contract
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Download contract dist
        uses: actions/download-artifact@v4
        with:
          name: contract-dist
          path: contract/dist/

      - name: Typecheck & build CLI
        working-directory: credshield-cli
        run: npm run ci

  # ──────────────────────────────────────────────────────────
  # JOB 4 · Build UI
  # ──────────────────────────────────────────────────────────
  ui:
    name: UI — Typecheck & Build
    runs-on: ubuntu-latest
    needs: contract
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck & build UI
        working-directory: credshield-ui
        run: npm run ci

  # ──────────────────────────────────────────────────────────
  # JOB 5 · Summary gate — all jobs must pass
  # ──────────────────────────────────────────────────────────
  all-checks-pass:
    name: ✅ All checks passed
    runs-on: ubuntu-latest
    needs: [contract, api, cli, ui]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.contract.result }}" != "success" ||
                "${{ needs.api.result }}"      != "success" ||
                "${{ needs.cli.result }}"      != "success" ||
                "${{ needs.ui.result }}"       != "success" ]]; then
            echo "❌ One or more jobs failed."
            exit 1
          fi
          echo "✅ All jobs passed — CredShield CI green."
