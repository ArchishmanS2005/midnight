name: CredShield Release

on:
  push:
    tags:
      - 'v*.*.*'          # triggers on v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'preprod'
        type: choice
        options: [preprod, preview]

permissions:
  contents: write   # needed to create GitHub Release
  packages: read

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 · Build release bundles for all packages
  # ──────────────────────────────────────────────────────────
  build-release:
    name: Build Release Bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Compact compiler
        run: |
          npm install -g @midnight-ntwrk/compact-compiler 2>/dev/null || true
          compact --version 2>/dev/null && echo "✅ compact available" || true

      - name: Compile ZK circuits
        working-directory: contract
        run: npm run compact || npx --yes @midnight-ntwrk/compact-compiler compile src/credshield.compact ./src/managed/credshield

      - name: Build contract
        working-directory: contract
        run: npm run build

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Build CLI
        working-directory: credshield-cli
        run: npm run build

      - name: Build UI
        working-directory: credshield-ui
        run: npm run build

      - name: Package release artifacts
        run: |
          mkdir -p release-bundles
          cp -r contract/dist   release-bundles/contract-dist
          cp -r api/dist        release-bundles/api-dist
          cp -r credshield-cli/dist release-bundles/cli-dist
          cp -r credshield-ui/dist  release-bundles/ui-dist
          tar -czf credshield-release.tar.gz release-bundles/

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: credshield-release
          path: credshield-release.tar.gz
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 2 · Create GitHub Release (tag pushes only)
  # ──────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: credshield-release

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CredShield ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: credshield-release.tar.gz
          body: |
            ## CredShield ${{ steps.version.outputs.VERSION }}

            Privacy-preserving verifiable credentials on the Midnight Blockchain.

            ### What's included
            - ✅ Compact ZK circuits (issueCredential · verifyCredential · revokeCredential)
            - ✅ API layer
            - ✅ Interactive CLI
            - ✅ React Web DApp

            ### Privacy model
            - Secret keys never leave the client (WitnessContext only)
            - Selective disclosure — prove validity without revealing metadata
            - Unlinkable verifications — no correlation between proof requests

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
